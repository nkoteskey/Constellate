name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Install Chromium for the Phase 6 browser gate
        run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: npm test
