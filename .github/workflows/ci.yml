name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # --with-deps adds system packages from Ubuntu's servers. When the runner can't reach them (2026-11-11: it
      # couldn't resolve them at all), install the browser alone: the runner image already has its libraries, only
      # fonts were missing, and no gate compares screenshots.
      - name: Install Chromium for the Phase 6 browser gate
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium || { echo "::warning::Ubuntu's package servers were unreachable; installing Chromium without its system packages"; npx playwright install chromium; }
      # The real x0x daemon for the network gate (test/gates/network_setup.test.ts): the pinned release, which
      # Constellate checks against its committed SHA-256 before running it.
      - name: Fetch the pinned x0x release for the network gate
        run: curl -fsSL -o "$RUNNER_TEMP/x0x-linux-x64-gnu.tar.gz" https://github.com/saorsa-labs/x0x/releases/download/v0.48.1/x0x-linux-x64-gnu.tar.gz && echo "CONSTELLATE_TEST_X0X_ARCHIVE=$RUNNER_TEMP/x0x-linux-x64-gnu.tar.gz" >> "$GITHUB_ENV"
      - run: npm test

  # This repository's own GitHub Action (action.yml, docs/CI_ACTION.md), run for real: a red step, then a green
  # one, with Constellate built from this checkout.
  ci-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - id: red
        continue-on-error: true
        uses: ./
        with:
          run: |
            node -e "console.error('Error: Cannot find module legacy-plugin'); process.exit(3)"
          constellate: node dist/cli.js
          remember: 'false'
      - id: green
        uses: ./
        with:
          run: echo all good
          constellate: node dist/cli.js
          remember: 'false'
      - name: Check what the Action reported
        env:
          RED: ${{ steps.red.outputs.exit-code }}
          OUTCOME: ${{ steps.red.outcome }}
          SUGGESTED: ${{ steps.red.outputs.suggested }}
          SINCE: ${{ steps.green.outputs.fixed-since-red }}
        run: |
          echo "red exit $RED ($OUTCOME), $SUGGESTED suggested; green fixed-since-red=$SINCE"
          test "$RED" = 3 && test "$OUTCOME" = failure && test -n "$SUGGESTED" && test "$SINCE" = true

  # The image MCP directories run (Docker MCP Catalog, Glama): build it, then check it answers a
  # handshake on a fresh data volume with no x0x daemon, ends when the client hangs up, and keeps
  # its data for the next run.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: docker build -t constellate-mcp .
      - name: First run (imports the starter library)
        run: node scripts/container-smoke.mjs docker run -i --rm -v constellate-data:/data constellate-mcp
      - name: Second run on the same volume
        run: |
          node scripts/container-smoke.mjs docker run -i --rm -v constellate-data:/data constellate-mcp
          docker run --rm -v constellate-data:/data --entrypoint ls constellate-mcp /data | grep -qx starter-imported
      - name: No container left running
        run: test -z "$(docker ps -q)"
