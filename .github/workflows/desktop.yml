name: Desktop

# Builds the Constellate desktop app (Electron + the pinned x0xd) for macOS, Windows and Linux.
# Pull requests that touch the app build and test it on Linux. A version tag (v*) or a manual
# run builds every installer; a tag also drafts a GitHub release for the owner to review and
# publish. Nothing is published automatically.
on:
  pull_request:
    paths: ['desktop/**', 'src/**', 'scripts/copy-web.mjs', '.github/workflows/desktop.yml']
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - run: npm ci
        working-directory: desktop
      - run: node desktop/scripts/stage.mjs
      - run: node desktop/scripts/fetch-x0x.mjs linux-x64-gnu
      - run: npx electron-builder --config builder.config.cjs --linux --publish never
        working-directory: desktop
      - name: Install Playwright for the end-to-end check
        run: npm install --no-save playwright@1.63.0
      - name: End-to-end: the packaged app with a stand-in x0xd
        run: xvfb-run -a node desktop/test/e2e.cjs
        env:
          DESKTOP_EXE: ${{ github.workspace }}/desktop/release/linux-unpacked/constellate-desktop
      - name: End-to-end: the packaged app with the real, bundled x0xd (offline)
        run: xvfb-run -a node desktop/test/e2e.cjs
        env:
          DESKTOP_EXE: ${{ github.workspace }}/desktop/release/linux-unpacked/constellate-desktop
          E2E_REAL_X0X: '1'
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: constellate-linux
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb

  installers:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            x0x: macos-arm64
            name: constellate-macos-arm64
            args: --mac --arm64
          - os: macos-15-intel
            x0x: macos-x64
            name: constellate-macos-x64
            args: --mac --x64
          - os: windows-latest
            x0x: windows-x64
            name: constellate-windows-x64
            args: --win --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: desktop
      - run: node desktop/scripts/stage.mjs
      - run: node desktop/scripts/fetch-x0x.mjs ${{ matrix.x0x }}
      - run: npx electron-builder --config builder.config.cjs ${{ matrix.args }} --publish never
        working-directory: desktop
        env:
          # Optional: add these repository secrets to sign (and, on macOS, notarize). Unsigned builds still work.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Draft the release (the owner reviews and publishes it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/* --repo "${GITHUB_REPOSITORY}" --draft --title "Constellate ${GITHUB_REF_NAME}" --notes "Desktop installers for macOS, Windows and Linux. See docs/DESKTOP.md for what's included and how to install."
