[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "constellate-mcp"
version = "0.1.0"
description = "Launcher for the Constellate MCP server (on x0x). Requires Node.js 22+."
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.9"

[project.scripts]
constellate-mcp = "constellate_mcp.__main__:main"
