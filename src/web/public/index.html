<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Constellate</title>
<style>
  :root { --bg: #0b0d14; --fg: #e8e6e3; --muted: #9aa0ae; --line: #22263a; --accent: #7cc4ff; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
  .p { border-top: 1px solid var(--line); padding: 16px 0; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  small { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Problems</h1>
  <p><small>Read-only problem viewer.</small></p>
  <div id="list"></div>
</main>
<script>
fetch('/api/problems').then(r => r.json()).then(ps => {
  document.getElementById('list').innerHTML = ps.map(p => `<div class="p"><b>${esc(p.title)}</b><br><small>${esc(p.hook || p.goal)}</small>
    <div class="bar"><i style="width:${100 * p.progress.done / p.progress.total}%"></i></div>
    <small>${p.progress.done}/${p.progress.total} checkpoints · ${p.contributors} contributors · done when: ${esc(p.definition_of_done.description)}</small></div>`).join('') || '<p>No problems yet.</p>';
});
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
</script>
</body>
</html>
